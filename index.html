<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>rostr</title>
    <!--
      Vue のマウントを待つと、light を選んでいる人に一瞬ダークが見えてしまう。
      描画前にここで data-theme を確定させる。判定は src/composables/useTheme.ts と同じ。
    -->
    <script>
      (function () {
        try {
          document.documentElement.dataset.theme =
            localStorage.getItem("rostr:theme") === "light" ? "light" : "dark";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
